name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Testler ağa çıkmaz ve tarayıcı açmaz; playwright tarayıcıları kurulmaz
      - name: Bağımlılıklar
        run: pip install -r requirements.txt pytest
      - name: Testler
        run: python -m pytest -q
